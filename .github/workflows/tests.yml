name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install $(grep '^ruff==' requirements_dev.txt)
      - name: Run ruff
        run: ruff check --output-format=github .

  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system packages
        run: |
          # Skip rebuilding the man page index after installing, which is slow
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config python3-dev libgirepository-2.0-dev gir1.2-gtk-3.0
      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements_dev.txt
      - name: Run unit tests
        run: pytest

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system packages
        run: |
          # Skip rebuilding the man page index after installing, which is slow
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libcairo2-dev pkg-config python3-dev libgirepository-2.0-dev gir1.2-gtk-3.0 weston
      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements_dev.txt
      - name: Run E2E tests
        run: scripts/run_behave.sh
        env:
          # Forcing 2 shards makes it go faster.
          ASTRASTACK_TEST_SHARDS: 2
          ASTRASTACK_TEST_CPUS: 2
