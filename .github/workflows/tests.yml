name: Tests

on:
  pull_request:
  push:
    branches: [master]

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev libgirepository-2.0-dev gir1.2-gtk-3.0
      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements_dev.txt
      - name: Run unit tests
        run: pytest

  e2e:
    name: E2E tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev pkg-config python3-dev libgirepository-2.0-dev gir1.2-gtk-3.0 weston
      - name: Install Python packages
        run: pip install -r requirements.txt -r requirements_dev.txt
      - name: Run E2E tests
        run: scripts/run_behave.sh
